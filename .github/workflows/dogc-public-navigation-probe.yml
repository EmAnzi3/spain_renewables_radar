name: dogc-public-navigation-probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dogc-public-navigation-probe.yml'
permissions:
  contents: read
concurrency:
  group: dogc-public-navigation-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Inspect exact publicly linked DOGC search and calendar assets
        run: |
          python - <<'PY'
          import hashlib,json,re
          from datetime import datetime,timezone
          from pathlib import Path
          from urllib.parse import urljoin,urlsplit
          import requests
          from bs4 import BeautifulSoup
          root=Path('reports/dogc_navigation_probe');root.mkdir(parents=True,exist_ok=True)
          s=requests.Session();s.headers['User-Agent']='SpainRenewablesRadar/0.5 (official public navigation probe)'
          audits=[]
          def get(url):
              for _ in range(4):
                  p=urlsplit(url)
                  if p.scheme!='https' or p.hostname!='dogc.gencat.cat' or p.username or p.password or p.port not in (None,443):raise ValueError('Unapproved public DOGC destination')
                  r=s.get(url,timeout=(8,30),allow_redirects=False,stream=True)
                  if r.status_code in (301,302,303,307,308):
                      url=urljoin(url,r.headers.get('Location',''));r.close();continue
                  try:
                      data=bytearray()
                      for part in r.iter_content(65536):
                          data.extend(part)
                          if len(data)>3_000_000:raise ValueError('Navigation probe size limit')
                      raw=bytes(data);digest=hashlib.sha256(raw).hexdigest()
                      (root/(digest+'.bin')).write_bytes(raw)
                      audits.append(dict(url=url,status=r.status_code,bytes=len(raw),sha256=digest,retrieved_at=datetime.now(timezone.utc).isoformat()))
                      print('ACQUISITION',json.dumps(audits[-1]),flush=True)
                      r.raise_for_status();return raw
                  finally:r.close()
              raise ValueError('Excessive DOGC redirects')
          try:
              home='https://dogc.gencat.cat/ca/inici/'
              raw=get(home);soup=BeautifulSoup(raw,'html.parser')
              links=[dict(text=a.get_text(' ',strip=True),url=urljoin(home,a['href'])) for a in soup.select('a[href]') if any(k in (a.get_text(' ',strip=True)+' '+a['href']).casefold() for k in ('informaci','resultats','sumari','data','consulta'))]
              print('PUBLIC_LINKS',json.dumps(links,ensure_ascii=False),flush=True)
              expected={'constants.js','functionsCommons.js','functionsFilterResultCommons.js','fpca_sumari_ultim_DOGC_publicat.js','fpca_calendari_dogc.js','fpca_cerca_resultats_dogc.js'}
              scripts={Path(urlsplit(urljoin(home,t['src'])).path).name:urljoin(home,t['src']) for t in soup.select('script[src]') if urlsplit(urljoin(home,t['src'])).hostname=='dogc.gencat.cat'}
              if not expected.issubset(scripts):raise ValueError('Required public navigation asset links missing')
              observations=[]
              for name in sorted(expected):
                  url=scripts[name];text=get(url).decode('utf-8',errors='strict')
                  if len(text)<30 or text.lstrip().lower().startswith(('<!doctype html','<html')):raise ValueError('Expected script source, not an error page')
                  relevant=[]
                  for line in text.splitlines():
                      if any(k in line.casefold() for k in ('apikey','api_key','token','password','authorization','secret')):continue
                      if any(k in line.casefold() for k in ('url','/api/','/rest/','publicationdate','searchdocument','sumari','calendar','fetch(','service','endpoint','ajax')):
                          relevant.append(line.strip()[:700])
                  observations.append(dict(script_url=url,asset_name=name,relevant_lines=relevant[:100]))
                  print('PUBLIC_SCRIPT_ROUTES',json.dumps(observations[-1],ensure_ascii=False),flush=True)
              result=dict(homepage_reachable=True,required_navigation_assets=len(observations),links=links,scripts=observations,collector_implemented=False,dated_events_created=0,note='Public-navigation probe only; no search results, permits or thirty-day coverage certified.')
              (root/'summary.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          finally:
              (root/'acquisition.json').write_text(json.dumps(audits,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dogc-public-navigation-probe-output
          path: reports/dogc_navigation_probe/
          if-no-files-found: error
