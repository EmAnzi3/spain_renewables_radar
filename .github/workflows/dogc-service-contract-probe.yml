name: dogc-service-contract-probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dogc-service-contract-probe.yml'
      - 'scripts/probe_dogc_services.py'
permissions:
  contents: read
concurrency:
  group: dogc-service-contract-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Probe observed public service host and actual source responses
        run: python -u scripts/probe_dogc_services.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dogc-service-contract-output
          path: reports/dogc_contract_probe/
          if-no-files-found: error
