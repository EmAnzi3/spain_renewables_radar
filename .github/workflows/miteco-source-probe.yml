name: miteco-source-probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/miteco-source-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probe MITECO open data catalog
        run: |
          python - <<'PY'
          import requests
          import urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          q="Registro de instalaciones de producción de energía eléctrica"
          bases=[
              "https://catalogo.datosabiertos.miteco.gob.es/catalogo/api/3/action/package_search",
              "https://catalogo.datosabiertos.miteco.gob.es/api/3/action/package_search",
          ]
          for base in bases:
              print("\n=====",base,"=====")
              try:
                  r=requests.get(base,params={"q":q},timeout=30,headers={"User-Agent":"SpainRenewablesRadar/0.1"},verify=False)
                  print("STATUS",r.status_code,r.headers.get("content-type"),r.url)
                  if not r.ok:
                      print(r.text[:5000])
                      continue
                  payload=r.json()
                  print("SUCCESS",payload.get("success"))
                  for pkg in payload.get("result",{}).get("results",[]):
                      print("PACKAGE",pkg.get("name"),"|",pkg.get("title"))
                      for res in pkg.get("resources",[]):
                          print("RESOURCE",res.get("format"),"|",res.get("name"),"|",res.get("url"))
              except Exception as exc:
                  print("ERROR",repr(exc))
          print("\n===== DIRECT CSV =====")
          direct="https://energia.serviciosmin.gob.es/Electra/descargarCSVProduccion.aspx"
          try:
              r=requests.get(direct,timeout=(30,240),headers={"User-Agent":"SpainRenewablesRadar/0.1"})
              print("STATUS",r.status_code,r.headers.get("content-type"),"BYTES",len(r.content))
              print("DISPOSITION",r.headers.get("content-disposition"))
              r.raise_for_status()
              raw=r.content
              for enc in ("utf-8-sig","cp1252","latin-1"):
                  try:
                      text=raw.decode(enc)
                      print("ENCODING",enc)
                      break
                  except UnicodeDecodeError:
                      pass
              lines=text.splitlines()
              print("LINES",len(lines))
              print("\n".join(lines[:35]))
          except Exception as exc:
              print("DIRECT_ERROR",repr(exc))
          PY
