name: regional-navigation-probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/regional-navigation-probe.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Inspect source navigation without guessing API or project data
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin,urlsplit,parse_qs
          import requests
          from bs4 import BeautifulSoup
          out=Path('reports/regional_navigation');out.mkdir(parents=True,exist_ok=True)
          session=requests.Session();session.headers['User-Agent']='SpainRenewablesRadar/0.2 navigation probe'
          url='https://mediambient.gva.es/es/web/energia/informacion-publica'
          r=session.get(url,timeout=(10,60));r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          (out/'gva.html').write_text(r.text,encoding='utf-8')
          seen=set(); cards=[]
          for a in soup.select('a[href]'):
              href=urljoin(r.url,a['href'])
              if '/asset_publisher/' not in href or not a.get_text(' ',strip=True) or a.get_text(' ',strip=True).startswith('+ info'):
                  continue
              query=parse_qs(urlsplit(href).query)
              code=next((v[0] for k,v in query.items() if k.endswith('_assetEntryId')),None)
              if not code or code in seen:continue
              seen.add(code)
              node=a
              levels=[]
              for i in range(5):
                  if node is None:break
                  levels.append({'depth':i,'tag':node.name,'attrs':node.attrs,'text':' '.join(node.stripped_strings)[:1300]})
                  node=node.parent
              cards.append({'code':code,'url':href,'ancestors':levels,'html':str(a.parent.parent)[:5500]})
          print('GVA_RECORD_CARD_COUNT',len(cards))
          print('GVA_CARDS',json.dumps(cards[:2],ensure_ascii=False))
          nav=[]
          for a in soup.find_all('a',href=True):
              if re.search(r'Siguiente|Último',a.get_text(' ',strip=True),re.I):
                  nav.append({'text':a.get_text(' ',strip=True),'url':urljoin(r.url,a['href'])})
          print('GVA_PAGINATION',json.dumps(nav,ensure_ascii=False))
          (out/'gva_cards.json').write_text(json.dumps(cards,ensure_ascii=False,indent=2),encoding='utf-8')
          for next_page in nav[:1]:
              nr=session.get(next_page['url'],timeout=(10,60));nr.raise_for_status()
              (out/'gva_next.html').write_text(nr.text,encoding='utf-8')
              ns=BeautifulSoup(nr.text,'html.parser')
              print('GVA_NEXT',nr.status_code,' '.join(ns.stripped_strings)[-1700:])
          landing='https://economia.xunta.gal/es/transparencia/documentos-sometidos-a-informacion-publica'
          gr=session.get(landing,timeout=(10,60));gr.raise_for_status()
          gs=BeautifulSoup(gr.text,'html.parser')
          links={}
          for a in gs.find_all('a',href=True):
              label=' '.join(a.stripped_strings)
              href=urljoin(gr.url,a['href'])
              if 'generaci' in label.casefold() and urlsplit(href).hostname=='economia.xunta.gal':links[href]=label
          print('GAL_GENERATION_LINKS',json.dumps(links,ensure_ascii=False))
          for i,(href,label) in enumerate(list(links.items())[:5]):
              try:
                  pr=session.get(href,timeout=(10,60));pr.raise_for_status()
                  ps=BeautifulSoup(pr.text,'html.parser');main=ps.find(id='main-content') or ps
                  for node in main.find_all(['nav','footer','header','script','style']):node.decompose()
                  (out/f'gal-{i}.html').write_text(pr.text,encoding='utf-8')
                  text=' '.join(main.stripped_strings)
                  selected=[]
                  for a in main.find_all('a',href=True):
                      label2=' '.join(a.stripped_strings);href2=urljoin(pr.url,a['href'])
                      if re.search(r'expediente|e[oó]lic|fotovolta|siguiente|seguinte|resolu',label2,re.I):
                          selected.append({'label':label2[:250],'url':href2})
                  print('GAL_PAGE',json.dumps({'url':pr.url,'http_status':pr.status_code,'text_prefix':text[:3500],
                                              'text_suffix':text[-1500:],'links':selected[:12]},ensure_ascii=False))
              except Exception as exc:print('GAL_PAGE_ERROR',href,str(exc))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-navigation-probe
          path: reports/regional_navigation/
          if-no-files-found: error
