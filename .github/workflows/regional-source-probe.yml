name: regional-source-probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/regional-source-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Inspect DOCM and DOE official search interfaces
        run: |
          python - <<'PY'
          import requests, urllib.parse
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers["User-Agent"]="SpainRenewablesRadar/0.1"

          pages={
            "DOCM":"https://docm.jccm.es/docm/busquedaAvanzada.do",
            "DOE":"https://doe.juntaex.es/busquedas/bus_avanzada.php",
          }

          for name,url in pages.items():
              print("\n===== "+name+" =====")
              try:
                  r=s.get(url,timeout=45)
                  print("STATUS",r.status_code,r.url,r.headers.get("content-type"))
                  r.raise_for_status()
                  soup=BeautifulSoup(r.text,"html.parser")
                  for i,form in enumerate(soup.find_all("form")):
                      print("FORM",i,"ACTION",urllib.parse.urljoin(url,form.get("action") or ""),"METHOD",form.get("method"))
                      for el in form.find_all(["input","select","textarea","button"]):
                          print("FIELD",el.name,"name=",el.get("name"),"value=",el.get("value"),"type=",el.get("type"))
                          if el.name=="select":
                              opts=[(o.get("value")," ".join(o.stripped_strings)) for o in el.find_all("option")[:12]]
                              print("OPTIONS",opts)
                  print("LINKS")
                  for a in soup.find_all("a",href=True):
                      href=urllib.parse.urljoin(url,a["href"])
                      label=" ".join(a.stripped_strings)
                      if any(k in (href+" "+label).lower() for k in ("xml","html","busca","diario","sumario","fecha","calend")):
                          print("LINK",label[:120],"|",href)
              except Exception as exc:
                  print("ERROR",repr(exc))
          print("\n===== DAILY PROBES =====")

          # DOCM daily summary shortcut
          try:
              url="https://docm.jccm.es/docm/cambiarBoletin.do?fecha=20261002"
              r=s.get(url,timeout=45)
              print("\nDOCM_DAILY",r.status_code,r.url,r.headers.get("content-type"))
              print(r.text[:25000])
          except Exception as exc:
              print("DOCM_DAILY_ERROR",repr(exc))

          # DOCM advanced POST, date-only
          try:
              url="https://docm.jccm.es/docm/tratarAccionBusqueda.do"
              data={
                  "paginaResultados":"1","tipoBusqueda":"avanzada","campoOrdenacion":"ordenFechaPublicacion",
                  "orden":"0","idConsejeria":"","idOrganoEmisor":"","historico":"false","rango":"",
                  "numeroRegistroInterno":"","anyoNumeroRegistroInterno":"","numeroDocumentoIni":"",
                  "tbnumeroDocumentoIni":"","fechaDocumentoIni":"","fechaDocumentoFin":"",
                  "fechapublicacionIni":"02/10/2026","fechapublicacionFin":"02/10/2026",
                  "numeroBoletinIni":"","anyoBoletinIni":"","soloSumario":"true","texto":"",
                  "idDescriptor":"","accion":"Buscar"
              }
              r=s.post(url,data=data,timeout=45)
              print("\nDOCM_POST",r.status_code,r.url,r.headers.get("content-type"))
              print(r.text[:25000])
          except Exception as exc:
              print("DOCM_POST_ERROR",repr(exc))

          # DOE direct daily summary: this is cleaner than the advanced search.
          try:
              url="https://doe.juntaex.es/ultimosdoe/mostrardoe.php?fecha=20261002&t=o"
              r=s.get(url,timeout=45)
              print("\nDOE_DAILY_ANCHORS",r.status_code,r.url,r.headers.get("content-type"))
              soup=BeautifulSoup(r.text,"html.parser")
              for a in soup.find_all("a",href=True):
                  href=urllib.parse.urljoin(url,a["href"])
                  label=" ".join(a.stripped_strings)
                  if label or any(k in href.lower() for k in ("html.php","pdf","xml")):
                      print("A",repr(label[:350]),"|",href)
          except Exception as exc:
              print("DOE_DAILY_ANCHORS_ERROR",repr(exc))

          # DOE date-only and keyword POSTs
          for keyword in ("","fotovoltaica","eólico"):
              try:
                  url="https://doe.juntaex.es/busquedas/disposiciones.php"
                  data={
                      "fecha1":"2026-10-02","fecha2":"2026-10-02","numero":"","anio":"",
                      "tipo":" ","orgabus":"","rango":"00","descriptor":"00","yuo":"0",
                      "textobus":keyword,"buscardesc":""
                  }
                  r=s.post(url,data=data,timeout=45)
                  print("\nDOE_POST",repr(keyword),r.status_code,r.url,r.headers.get("content-type"))
                  print(r.text[:25000])
              except Exception as exc:
                  print("DOE_POST_ERROR",repr(keyword),repr(exc))
          PY
