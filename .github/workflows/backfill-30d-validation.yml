name: backfill-30d-validation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/backfill-30d-validation.yml'
      - 'app/**'
      - 'tests/**'
      - 'scripts/**'
      - 'config/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: official-backfill-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      SABIA_WORKERS: '4'
      SABIA_FORCE_LIVE_SAMPLE: '1'
      SABIA_SEED_RUN_ID: '37184831950'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Unit and regression tests before collection
        run: python -m unittest discover -s tests -v
      - name: Optional recent official detail cache
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: 37184831950
          name: sabia-30d-output
          path: sabia-recovery-input
      - name: Preserve original cache retrieval dates and re-fetch all discovery indexes
        run: python scripts/recover_sabia_snapshot.py
      - name: Freeze complete Spanish calendar day and same-run snapshot scope
        run: |
          echo "VALIDATION_UNTIL=$(TZ=Europe/Madrid date -d yesterday +%F)" >> "$GITHUB_ENV"
          echo "BORM_RUN_SNAPSHOT_DIR=data/run_snapshots" >> "$GITHUB_ENV"
          echo "BORM_RUN_SNAPSHOT_SCOPE=${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Eleven-source live smoke before full backfill
        timeout-minutes: 25
        run: |
          python -m app.run_pipeline --days 3 --until "$VALIDATION_UNTIL" --db data/full_smoke.sqlite --skip-ree --skip-miteco --strict-coverage
          mkdir -p smoke_output
          cp -r reports docs smoke_output/
      - name: Eleven-source 30-day backfill with national enrichment
        timeout-minutes: 25
        run: python -m app.run_pipeline --days 30 --until "$VALIDATION_UNTIL" --strict-coverage
      - name: Certify source coverage, identities, provenance, missing data and idempotency
        run: |
          python scripts/validate_complete_pipeline.py
          python - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          smoke=json.loads(Path('smoke_output/reports/borm/index_acquisition.json').read_text())
          backfill=json.loads(Path('reports/borm/index_acquisition.json').read_text())
          assert smoke['acquisition_mode']=='LIVE', 'BORM discovery must be live in this run'
          assert backfill['acquisition_mode']=='RUN_SNAPSHOT_REUSE'
          assert smoke['sha256']==backfill['sha256']
          assert smoke['retrieved_at']==backfill['retrieved_at'], 'Do not redate source evidence'
          assert backfill['run_snapshot_scope']==os.environ['BORM_RUN_SNAPSHOT_SCOPE']
          assert hashlib.sha256(Path('reports/borm/index_raw.json').read_bytes()).hexdigest()==backfill['sha256']
          p=Path('reports/validation_metrics.json');data=json.loads(p.read_text())
          data.update(borm_acquisition_mode=backfill['acquisition_mode'],borm_same_run_scope=backfill['run_snapshot_scope'],borm_original_acquisition_preserved=True)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          print('BORM_SAME_RUN_AUDIT',json.dumps({k:v for k,v in data.items() if k.startswith('borm_')},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backfill-30d-output
          path: |
            data/spain_renewables.sqlite
            data/full_smoke.sqlite
            data/sabia_cache/
            data/run_snapshots/
            data/migrations/
            smoke_output/
            reports/
            docs/
            app/
            tests/
            scripts/
            config/
            .github/workflows/
          if-no-files-found: error
