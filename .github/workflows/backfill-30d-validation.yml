name: backfill-30d-validation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/backfill-30d-validation.yml'
      - 'app/collectors/*.py'
      - 'app/parser.py'
      - 'app/identifiers.py'
      - 'app/identity_migration.py'
      - 'app/store.py'
      - 'app/lifecycle.py'
      - 'app/geo.py'
      - 'app/run_pipeline.py'
      - 'app/reporting.py'
      - 'app/scoring.py'
      - 'app/enrichment/*.py'
      - 'app/db.py'
permissions:
  contents: read
concurrency:
  group: official-backfill-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Unit tests before live collection
        run: python -m unittest discover -s tests -v
      - name: Run 30-day official-source backfill
        timeout-minutes: 25
        run: python -m app.run_pipeline --days 30 --until "$(TZ=Europe/Madrid date -d yesterday +%F)" --strict-coverage
      - name: Print backfill metrics and check identity invariants
        run: |
          python - <<'PY'
          import csv,json,sqlite3
          from pathlib import Path
          from collections import Counter
          from app.identifiers import valid_expediente
          con=sqlite3.connect('data/spain_renewables.sqlite');con.row_factory=sqlite3.Row
          with open('reports/quality_issues_latest.csv',encoding='utf-8-sig') as f:quality=Counter(r['severity'] for r in csv.DictReader(f))
          with open('reports/coverage_latest.csv',encoding='utf-8-sig') as f:coverage=list(csv.DictReader(f))
          invalid=[dict(r) for r in con.execute('SELECT project_key,expediente FROM projects WHERE expediente IS NOT NULL') if not valid_expediente(r['expediente'])]
          metrics={
            'projects':con.execute('SELECT count(*) FROM projects').fetchone()[0],
            'events':con.execute('SELECT count(*) FROM events').fetchone()[0],
            'by_source':dict(con.execute('SELECT source_code,count(*) FROM events GROUP BY source_code').fetchall()),
            'quality':dict(quality),'source_day_errors':sum(r['status']=='ERROR' for r in coverage),
            'invalid_project_identifiers':invalid,
            'missing':dict(con.execute('SELECT sum(project_name IS NULL) no_name,sum(power_mw IS NULL) no_mw,sum(province IS NULL) no_province,sum(expediente IS NULL) no_expediente FROM projects').fetchone()),
          }
          print('CERTIFICATION',json.dumps(metrics,ensure_ascii=False))
          Path('reports/validation_metrics.json').write_text(json.dumps(metrics,ensure_ascii=False,indent=2),encoding='utf-8')
          if invalid or quality['ERROR'] or metrics['source_day_errors']:raise SystemExit('Identity, quality or coverage gate failed')
          con.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backfill-30d-output
          path: |
            data/spain_renewables.sqlite
            data/migrations/
            reports/
            docs/
            app/
            tests/
            scripts/
            config/
          if-no-files-found: error
