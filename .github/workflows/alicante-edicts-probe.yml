name: alicante-edicts-source-probe
on:
  workflow_dispatch:
  push:
    branches: ['feat/operational-web-preview', 'main']
    paths:
      - '.github/scripts/probe_alicante_edicts.py'
      - '.github/workflows/alicante-edicts-probe.yml'
permissions:
  contents: read
concurrency:
  group: alicante-edicts-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -u .github/scripts/probe_alicante_edicts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alicante-edicts-probe-output
          path: reports/alicante_edicts_probe/
          if-no-files-found: error
