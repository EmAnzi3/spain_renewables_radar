name: dogc-pagination-contract-audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dogc-pagination-contract-audit.yml'
permissions:
  contents: read
concurrency:
  group: dogc-pagination-contract-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify whole-search export URL from the actual official response
        run: |
          python -u - <<'PY'
          import csv,hashlib,io,json
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          from urllib.parse import urlsplit,parse_qs
          from zoneinfo import ZoneInfo
          import requests
          from scripts.probe_dogc_services import VerifiedDOGCTLSAdapter,SERVICE
          from scripts.audit_dogc_index import search_parameters
          out=Path('reports/dogc_pagination_contract');out.mkdir(parents=True,exist_ok=True)
          session=requests.Session();session.mount(SERVICE+'/',VerifiedDOGCTLSAdapter())
          end=datetime.now(ZoneInfo('Europe/Madrid')).date()-timedelta(days=1);start=end-timedelta(days=29)
          def read(response,label):
              try:
                  response.raise_for_status()
                  if response.status_code!=200:raise ValueError('Unexpected source redirect')
                  chunks=[];size=0
                  for chunk in response.iter_content(65536):
                      size+=len(chunk)
                      if size>8000000:raise ValueError('Bounded public export limit exceeded')
                      chunks.append(chunk)
                  raw=b''.join(chunks);(out/(label+'.bin')).write_bytes(raw)
                  print('EXPORT_ACQUISITION',json.dumps({'label':label,'url':response.url,'bytes':size,'sha256':hashlib.sha256(raw).hexdigest(),'content_type':response.headers.get('Content-Type'),'retrieved_at':datetime.now(timezone.utc).isoformat()},ensure_ascii=False))
                  return raw
              finally:response.close()
          raw=read(session.post(SERVICE+'/eadop-rest/api/dogc/searchDOGC',json=search_parameters(start,end,1),timeout=(8,40),allow_redirects=False,stream=True),'search')
          data=json.loads(raw);url=data['urlCSVDownloadSearch'];p=urlsplit(url);q=parse_qs(p.query)
          if p.scheme!='https' or p.hostname!='portaldogc.gencat.cat' or p.path!='/utilsEADOP/AppJava/ExcelProviderServlet' or p.username or p.password or p.port not in (None,443):raise ValueError('Unexpected export endpoint')
          if q.get('idSearch')!=[str(data['searchId'])] or q.get('portal')!=['dogc'] or q.get('typeDownload')!=['csv']:raise ValueError('Export does not match original search')
          raw=read(session.get(url,timeout=(8,40),allow_redirects=False,stream=True),'official-export')
          try:text=raw.decode('utf-8-sig');encoding='utf-8-sig'
          except UnicodeDecodeError:text=raw.decode('cp1252');encoding='cp1252'
          print('EXPORT_TEXT_PREFIX',repr(text[:2500]))
          try:
              dialect=csv.Sniffer().sniff(text[:20000],delimiters=';,\t');rows=list(csv.reader(io.StringIO(text),dialect))
              print('EXPORT_CSV_SHAPE',json.dumps({'encoding':encoding,'delimiter':dialect.delimiter,'rows':len(rows),'headers_and_first_rows':rows[:5],'last_rows':rows[-2:],'search_total':data['numResultSearch']},ensure_ascii=False))
          except csv.Error as exc:print('EXPORT_CSV_ERROR',str(exc))
          (out/'summary.json').write_text(json.dumps({'search_total':data['numResultSearch'],'search_id':data['searchId'],'export_url':url,'encoding':encoding,'body_bytes':len(raw),'index_certified':False},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dogc-pagination-contract-output
          path: reports/dogc_pagination_contract/
          if-no-files-found: error
