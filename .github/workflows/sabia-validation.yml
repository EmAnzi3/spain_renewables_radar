name: sabia-validation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sabia-validation.yml'
      - 'app/collectors/sabia.py'
      - 'tests/test_sabia*.py'
      - 'scripts/validate_sabia_output.py'
      - 'scripts/recover_sabia_snapshot.py'
      - 'app/parser.py'
      - 'app/run_pipeline.py'
      - 'app/collectors/__init__.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: sabia-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
      SABIA_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Unit and regression tests before network work
        run: python -m unittest discover -s tests -v
      - name: Restore validated partial acquisition for same-day recovery
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37158247454
          name: sabia-30d-output
          path: sabia-recovery-input
      - name: Recover only missing official details using the source navigation form
        timeout-minutes: 12
        run: python scripts/recover_sabia_snapshot.py
      - name: Freeze last complete Spanish calendar day
        run: echo "VALIDATION_UNTIL=$(TZ=Europe/Madrid date -d yesterday +%F)" >> "$GITHUB_ENV"
      - name: Acquire full inventory and run 3-day smoke
        timeout-minutes: 15
        run: python -m app.run_pipeline --days 3 --until "$VALIDATION_UNTIL" --db data/sabia_smoke.sqlite --sources MITECO_SABIA --skip-ree --skip-miteco --strict-coverage
      - name: Backfill 30 days from the same acquired snapshot
        timeout-minutes: 6
        run: python -m app.run_pipeline --days 30 --until "$VALIDATION_UNTIL" --db data/sabia_backfill.sqlite --sources MITECO_SABIA --skip-ree --skip-miteco --strict-coverage
      - name: Verify coverage quality and nonempty backfill
        run: python scripts/validate_sabia_output.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sabia-30d-output
          path: |
            data/sabia_cache/
            data/sabia_smoke.sqlite
            data/sabia_backfill.sqlite
            reports/
            docs/
          if-no-files-found: error
