name: sabia-validation
on:
  workflow_dispatch:
# Standalone diagnostic; standard push validation now includes SABIA in the full pipeline.
permissions:
  contents: read
  actions: read
concurrency:
  group: sabia-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
      SABIA_WORKERS: '4'
      SABIA_FORCE_LIVE_SAMPLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Unit and regression tests before network work
        run: python -m unittest discover -s tests -v
      - name: Optional existing official HTML cache (not a source-coverage waiver)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: 37160816843
          name: sabia-30d-output
          path: sabia-recovery-input
      - name: Reuse only recent raw details with original retrieval dates and hashes
        run: python scripts/recover_sabia_snapshot.py
      - name: Freeze last complete Spanish calendar day
        run: echo "VALIDATION_UNTIL=$(TZ=Europe/Madrid date -d yesterday +%F)" >> "$GITHUB_ENV"
      - name: Fetch all five live indexes, refresh changed records and a live sample; smoke
        timeout-minutes: 25
        run: python -m app.run_pipeline --days 3 --until "$VALIDATION_UNTIL" --db data/sabia_smoke.sqlite --sources MITECO_SABIA --skip-ree --skip-miteco --strict-coverage
      - name: Backfill 30 days using original administrative dates
        timeout-minutes: 8
        run: python -m app.run_pipeline --days 30 --until "$VALIDATION_UNTIL" --db data/sabia_backfill.sqlite --sources MITECO_SABIA --skip-ree --skip-miteco --strict-coverage
      - name: Verify coverage, component identities, quality and date semantics
        run: python scripts/validate_sabia_output.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sabia-30d-output
          path: |
            data/sabia_cache/
            data/sabia_smoke.sqlite
            data/sabia_backfill.sqlite
            reports/
            docs/
          if-no-files-found: error
