name: source-api-probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/source-api-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe official free APIs
        run: |
          python - <<'PY'
          import json, urllib.request

          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"SpainRenewablesRadar/0.1","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.status,r.headers.get("content-type"),r.read().decode("utf-8","replace")

          urls={
            "BOCYL_SCHEMA":"https://analisis.datosabiertos.jcyl.es/api/explore/v2.1/catalog/datasets/bocyl",
            "BOCYL_RECORD":"https://analisis.datosabiertos.jcyl.es/api/explore/v2.1/catalog/datasets/bocyl/records?limit=1",
            "BOCYL_DAY":"https://analisis.datosabiertos.jcyl.es/api/explore/v2.1/catalog/datasets/bocyl/records?limit=5&where=fecha_publicacion%3Ddate%272026-10-02%27",
            "BOJA_OPENAPI":"https://datos.juntadeandalucia.es/api/v0/boja/openapi.json",
            "BOJA_DAY":"https://datos.juntadeandalucia.es/api/v0/boja/get/search_pagination?order_by=dateUTC&mode=DESC&size=10&page=0&date_from=2026-10-02&date_to=2026-10-02",
            "BOA_CKAN":"https://opendata.aragon.es/ckan/api/3/action/package_show?id=boletin-oficial-aragon-diario",
            "BOA_XML_TEST":"https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VERLST&BASE=BZHT&DOCS=1-20&SEC=OPENDATABOAXML&OUTPUTMODE=XML&SORT=-PUBL&SEPARADOR=&%40PUBL-GE=20261002&%40PUBL-LE=20261002&NUMB=&RANG=&TITU-C=&FDIS-C=&TITU=&ORGA-C=&TEXT-C=fotovolta&SECC-C=BOA%2Bo%2BDisposiciones%2Bo%2BPersonal%2Bo%2BAcuerdos%2Bo%2BJusticia%2Bo%2BAnuncios&SECC=&SUBS-C=&MATE-C=",
            "BOA_JSON_TEST":"https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VERLST&BASE=BZHT&DOCS=1-20&SEC=OPENDATABOAJSON&OUTPUTMODE=XML&SORT=-PUBL&SEPARADOR=&%40PUBL-GE=20261002&%40PUBL-LE=20261002&NUMB=&RANG=&TITU-C=&FDIS-C=&TITU=&ORGA-C=&TEXT-C=e%C3%B3lico&SECC-C=BOA%2Bo%2BDisposiciones%2Bo%2BPersonal%2Bo%2BAcuerdos%2Bo%2BJusticia%2Bo%2BAnuncios&SECC=&SUBS-C=&MATE-C=",
          }
          for name,url in urls.items():
              print("\n===== "+name+" =====")
              try:
                  status,ct,body=get(url)
                  print("STATUS",status,"CT",ct)
                  try:
                      obj=json.loads(body)
                      if name=="BOCYL_SCHEMA":
                          print(json.dumps(obj,ensure_ascii=False)[:12000])
                      elif name in ("BOCYL_RECORD","BOCYL_DAY"):
                          print(json.dumps(obj,ensure_ascii=False)[:8000])
                      elif name=="BOJA_DAY":
                          print(json.dumps(obj,ensure_ascii=False)[:16000])
                      elif name=="BOJA_OPENAPI":
                          print("PATHS")
                          print("\n".join(sorted(obj.get("paths",{}).keys())))
                          print("SEARCH GET",json.dumps(obj.get("paths",{}).get("/api/v0/boja/search",{}).get("get",{}),ensure_ascii=False)[:15000])
                          for pname in ("/api/v0/boja/get/calendar","/api/v0/boja/get/bulletin","/api/v0/boja/get/search_pagination","/api/v0/boja/all"):
                              print("PATH",pname,json.dumps(obj.get("paths",{}).get(pname,{}).get("get",{}),ensure_ascii=False)[:12000])
                          comps=obj.get("components",{}).get("schemas",{})
                          for cname in ("_Enum_Title_Sec","_Enum_Organisation","_Enum_Tipo_Disposition","_Enum_Subtitle","_Enum_Version","_Enum_fields","_Enum_Mode"):
                              print("SCHEMA",cname,json.dumps(comps.get(cname,{}),ensure_ascii=False)[:8000])
                      elif name in ("BOA_XML_TEST","BOA_JSON_TEST"):
                          print(body[:16000])
                      elif name=="BOA_CKAN":
                          result=obj.get("result",{})
                          print("TITLE",result.get("title"))
                          for x in result.get("resources",[]):
                              print(json.dumps({k:x.get(k) for k in ("name","format","url","description")},ensure_ascii=False))
                  except Exception:
                      print(body[:12000])
              except Exception as exc:
                  print("ERROR",repr(exc))
          print("\n===== BOA_SCRIPTS =====")
          try:
              status,ct,body=get("https://www.boa.aragon.es/")
              import re, urllib.parse
              scripts=re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)["\\\']',body,re.I)
              scripts=[urllib.parse.urljoin("https://www.boa.aragon.es/",s) for s in scripts]
              print("SCRIPTS",scripts)
              for s in scripts:
                  if "google" in s or "readspeaker" in s:
                      continue
                  try:
                      st,ct2,js=get(s)
                      hits=[line for line in js.splitlines() if any(k in line.lower() for k in ("opendata","brscgi","verl","bzht","busquedafecha"))]
                      if hits:
                          print("SCRIPT",s)
                          print("\n".join(hits[:200])[:20000])
                  except Exception as exc:
                      print("SCRIPT_ERROR",s,repr(exc))
          except Exception as exc:
              print("BOA_SCRIPTS_ERROR",repr(exc))

          print("\n===== BOA_JS_SNIPPETS =====")
          try:
              status,ct,body=get("https://www.boa.aragon.es/")
              import re, urllib.parse
              scripts=re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)["\\\']',body,re.I)
              scripts=[urllib.parse.urljoin("https://www.boa.aragon.es/",s) for s in scripts]
              for s in scripts:
                  if "/main." not in s:
                      continue
                  st,ct2,js=get(s)
                  low=js.lower()
                  for key in ("opendata","brscgi","verl","bzht","http","api/"):
                      print("KEY",key)
                      pos=0
                      count=0
                      while True:
                          pos=low.find(key,pos)
                          if pos<0 or count>=12:
                              break
                          print(js[max(0,pos-500):min(len(js),pos+1200)])
                          print("---")
                          pos+=len(key)
                          count+=1
          except Exception as exc:
              print("BOA_JS_SNIPPETS_ERROR",repr(exc))
          PY
