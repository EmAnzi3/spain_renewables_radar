name: live-official-sources-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    paths:
      - ".github/workflows/live-boe-smoke.yml"
      - "app/collectors/*.py"
      - "app/parser.py"
      - "app/lifecycle.py"
      - "app/geo.py"
      - "app/run_pipeline.py"
      - "app/reporting.py"
      - "app/enrichment/*.py"
      - "app/db.py"

jobs:
  live-boe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scan last 3 days across implemented official sources
        run: python -m app.run_pipeline --days 3 --strict-coverage
      - name: Upload smoke outputs
        uses: actions/upload-artifact@v4
        with:
          name: official-sources-smoke-output
          path: |
            reports/change_reports/
            reports/coverage_latest.csv
            reports/coverage_latest.html
            reports/quality_issues_latest.csv
            reports/quality_issues_latest.html
            reports/ree_capacity_latest.csv
            reports/miteco_registry_latest.csv
            reports/miteco_exact_matches_latest.csv
            reports/miteco_registry_latest.txt
            docs/data.json
            docs/index.html
          if-no-files-found: error
