name: live-official-sources-smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
# Pushes are covered by the sequential smoke + backfill workflow, not concurrent full scans.
permissions:
  contents: read
  actions: read
concurrency:
  group: official-smoke-${{ github.ref }}
  cancel-in-progress: false
jobs:
  live-boe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
      SABIA_WORKERS: '4'
      SABIA_SEED_RUN_ID: '37184831950'
      SABIA_FORCE_LIVE_SAMPLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Optional recent official detail cache
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: 37184831950
          name: sabia-30d-output
          path: sabia-recovery-input
      - run: python scripts/recover_sabia_snapshot.py
      - name: Scan last three complete days across implemented sources
        run: python -m app.run_pipeline --days 3 --until "$(TZ=Europe/Madrid date -d yesterday +%F)" --strict-coverage
      - name: Upload smoke outputs even when coverage fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-sources-smoke-output
          path: |
            reports/
            docs/
            data/spain_renewables.sqlite
          if-no-files-found: error
