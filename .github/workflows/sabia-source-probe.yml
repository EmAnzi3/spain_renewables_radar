name: SABIA source probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sabia-source-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe official MITECO SABIA
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          url="https://sede.miteco.gob.es/portal/site/seMITECO/template.PAGE/navSabiaDestacados/navServicioContenido"
          s=requests.Session()
          s.headers.update({"User-Agent":"SpainRenewablesRadar/0.1 (+GitHub Actions source probe)"})
          r=s.get(url,timeout=60)
          print("STATUS",r.status_code)
          print("FINAL_URL",r.url)
          print("CONTENT_TYPE",r.headers.get("content-type"))
          print("BYTES",len(r.content))
          r.raise_for_status()

          soup=BeautifulSoup(r.text,"html.parser")
          print("TITLE",soup.title.get_text(" ",strip=True) if soup.title else "")
          forms=soup.find_all("form")
          print("FORMS",len(forms))
          for i,f in enumerate(forms[:10],1):
              print("FORM",i,"METHOD",f.get("method"),"ACTION",urljoin(r.url,f.get("action") or ""))
              for inp in f.find_all(["input","select"],limit=20):
                  print(" FIELD",inp.name,inp.get("name"),inp.get("value"),inp.get("id"))

          interesting=[]
          for a in soup.find_all("a",href=True):
              href=urljoin(r.url,a["href"])
              text=" ".join(a.stripped_strings)
              low=(href+" "+text).casefold()
              if any(k in low for k in ("sabia","proy_","codigo_seleccionado","evaluacion","localizacion","documentacion")):
                  interesting.append((text,href))
          print("INTERESTING_LINKS",len(interesting))
          for a in soup.find_all("a"):
              txt=" ".join(a.stripped_strings)
              if "consulta de proyectos" in txt.casefold():
                  print("PROJECT_SEARCH_LINK",a.attrs,repr(txt))
          for text,href in interesting[:80]:
              print("LINK",repr(text[:160]),href)

          detail=[x for x in interesting if "codigo_seleccionado=" in x[1]]
          print("DETAIL_LINKS",len(detail))
          if not detail:
              # SABIA pages sometimes keep navigation in onclick attributes.
              raw=[]
              for tag in soup.find_all(True):
                  for attr in ("onclick","href"):
                      v=tag.get(attr)
                      if v and "codigo_seleccionado" in v:
                          raw.append(v)
              print("RAW_CODE_ATTRS",len(raw))
              for v in raw[:50]:
                  print("RAW",v)

          search_url="https://sede.miteco.gob.es/portal/site/seMITECO/navServicioContenido"
          sr=s.get(search_url,timeout=60)
          print("SEARCH_PAGE",sr.status_code,sr.url,len(sr.content))
          ss=BeautifulSoup(sr.text,"html.parser")
          print("SEARCH_TITLE",ss.title.get_text(" ",strip=True) if ss.title else "")
          for i,sf in enumerate(ss.find_all("form"),1):
              print("SEARCH_FORM",i,sf.get("method"),sf.get("action"))
              for tag in sf.find_all(["input","select","option","button"]):
                  attrs={k:v for k,v in tag.attrs.items() if k in ("name","id","value","type","selected","onclick")}
                  txt=" ".join(tag.stripped_strings)
                  if attrs or txt:
                      print(" SEARCH_FIELD",tag.name,attrs,repr(txt[:180]))
          sbody=" ".join(ss.stripped_strings)
          print("SEARCH_BODY",sbody[:5000])
          # Inspect search JavaScript and perform a narrow official FTV search.
          fn_start=sr.text.find("function enviar()")
          print("SEARCH_ENVIAR_BLOCK",sr.text[fn_start:fn_start+5000].replace("\n"," ") if fn_start>=0 else "NOT_FOUND")
          for line in sr.text.splitlines():
              if "enviar(" in line or "select_tipo" in line or "id_pagina_cargada" in line:
                  clean=" ".join(line.split())
                  if clean:
                      print(" SEARCH_JS",clean[:2500])
          sf=ss.find("form")
          search_payload={}
          if sf:
              for inp in sf.find_all("input"):
                  name=inp.get("name")
                  if name:
                      search_payload[name]=inp.get("value") or ""
          search_payload.update({
              "accion":"proy_resultados",
              "select_comunidades":"",
              "codigo":"",
              "titulo":"",
              "select_estado_tramitacion":"",
              "select_tipo":"FTV",
              "select_organo_sustantivo":"",
              "select_promotor":"",
          })
          rr=s.post(search_url,data=search_payload,timeout=120)
          print("SEARCH_POST",rr.status_code,rr.url,len(rr.content))
          rs=BeautifulSoup(rr.text,"html.parser")
          rbody=" ".join(rs.stripped_strings)
          print("SEARCH_RESULT_BODY",rbody[:7000])
          result_codes=[]
          for tag in rs.find_all(True):
              onclick=tag.get("onclick") or ""
              if "proy_detalle" in onclick or "ea_detalle" in onclick:
                  m=re.search(r"20[0-9]{6}",onclick)
                  if m:
                      result_codes.append(m.group(0))
          print("SEARCH_RESULT_CODES",len(result_codes),result_codes[:50])
          for tag in rs.find_all(["a","input","button"]):
              attrs=" ".join(str(v) for v in tag.attrs.values())
              txt=" ".join(tag.stripped_strings)
              low=(attrs+" "+txt).casefold()
              if any(k in low for k in ("siguiente","anterior","pagina","página","proy_detalle")):
                  print(" SEARCH_RESULT_CONTROL",tag.name,tag.attrs,repr(txt[:180]))

          # Inspect the actual controls surrounding known current projects.
          for keyword in ("MUEL","CIUDAD RODRIGO","CLAVELLINAS","MALAGATO"):
              node=soup.find(string=re.compile(keyword,re.I))
              print("KEYWORD",keyword,"FOUND",bool(node))
              if node:
                  tag=node.parent
                  for depth in range(6):
                      if tag is None:
                          break
                      attrs={k:v for k,v in tag.attrs.items() if k in ("id","class","onclick","href","value","name","action","method")}
                      print(" CONTEXT",depth,tag.name,attrs)
                      if depth <= 2:
                          print(" HTML",str(tag)[:5000].replace("\n"," "))
                      tag=tag.parent

          # Dump controls carrying SABIA action/codes even when they are not anchors.
          controls=[]
          for tag in soup.find_all(["input","button","a"]):
              attrs=" ".join(str(v) for v in tag.attrs.values())
              txt=" ".join(tag.stripped_strings)
              low=(attrs+" "+txt).casefold()
              if any(k in low for k in ("proy_","codigo","documentacion","localizacion","detalle")):
                  controls.append((tag.name,tag.attrs,txt))
          print("INTERESTING_CONTROLS",len(controls))
          for name,attrs,txt in controls[:120]:
              print("CONTROL",name,attrs,repr(txt[:240]))

          # Reproduce SABIA's form POST used by enviar('ea_detalle', code).
          js=re.search(r"function\\s+enviar\\s*\\([^)]*\\)\\s*\\{(.{0,2500}?)\\}",r.text,re.I|re.S)
          print("ENVIAR_JS",js.group(0)[:2500].replace("\n"," ") if js else "NOT_FOUND")
          form=forms[0] if forms else None
          base_payload={}
          if form:
              for inp in form.find_all("input"):
                  name=inp.get("name")
                  if name:
                      base_payload[name]=inp.get("value") or ""
          print("BASE_PAYLOAD",base_payload)
          for code in ("20260236","20260181","20260211"):
              payload=dict(base_payload)
              payload["accion"]="ea_detalle"
              payload["codigo_seleccionado"]=code
              payload["id_pagina_cargada"]="DESTACADOS"
              d=s.post(url,data=payload,timeout=60)
              print("POST_DETAIL",code,d.status_code,d.url,len(d.content))
              ds=BeautifulSoup(d.text,"html.parser")
              body=" ".join(ds.stripped_strings)
              for label in (
                  "Código de Evaluación Ambiental",
                  "Código para el Órgano Sustantivo",
                  "Título del proyecto",
                  "Promotor",
                  "Tipo de proyecto",
                  "Comunidad autónoma",
                  "Provincia",
                  "Municipio",
                  "Estado de tramitación",
                  "Fecha de entrada",
                  "Fecha inicio de consultas",
                  "Fecha de resolución",
                  "Sentido de la resolución",
              ):
                  pos=body.casefold().find(label.casefold())
                  if pos>=0:
                      print(" POST_FIELD",code,label,"=>",body[pos:pos+500])
              print(" POST_HAS_MUEL",code,"MUEL" in body.upper())
              detail_form=ds.find("form")
              detail_payload={}
              if detail_form:
                  for inp in detail_form.find_all("input"):
                      name=inp.get("name")
                      if name:
                          detail_payload[name]=inp.get("value") or ""
              print(" DETAIL_BASE_PAYLOAD",code,detail_payload)
              full_payload=dict(detail_payload)
              full_payload["accion"]="proy_detalle"
              full_payload["codigo_seleccionado"]=code
              full=s.post(url,data=full_payload,timeout=60)
              print(" FULL_DETAIL",code,full.status_code,full.url,len(full.content))
              fs=BeautifulSoup(full.text,"html.parser")
              fbody=" ".join(fs.stripped_strings)
              print(" FULL_BODY",code,fbody[:6500])
              for label in (
                  "Código de Evaluación Ambiental",
                  "Código para el Órgano Sustantivo",
                  "Título del proyecto",
                  "Promotor",
                  "Tipo de proyecto",
                  "Comunidad autónoma",
                  "Provincia",
                  "Municipio",
                  "Estado de tramitación",
                  "Fecha de entrada",
                  "Fecha inicio de consultas",
                  "Fecha de resolución",
                  "Sentido de la resolución",
              ):
                  pos=fbody.casefold().find(label.casefold())
                  if pos>=0:
                      print(" FULL_FIELD",code,label,"=>",fbody[pos:pos+650])
              print(" POST_BODY",code,body[:3500])
              for tag in ds.find_all(["a","input","button","form"]):
                  attrs=" ".join(str(v) for v in tag.attrs.values())
                  txt=" ".join(tag.stripped_strings)
                  low=(attrs+" "+txt).casefold()
                  if any(k in low for k in ("proy_detalle","ea_detalle","document","expediente","tramita")):
                      print(" POST_CONTROL",code,tag.name,tag.attrs,repr(txt[:300]))
          for text,href in detail[:3]:
              d=s.get(href,timeout=60)
              print("DETAIL_STATUS",d.status_code,href)
              print("DETAIL_BYTES",len(d.content))
              if d.ok:
                  ds=BeautifulSoup(d.text,"html.parser")
                  body=" ".join(ds.stripped_strings)
                  for label in (
                      "Código de Evaluación Ambiental",
                      "Código para el Órgano Sustantivo",
                      "Título del proyecto",
                      "Promotor",
                      "Tipo de proyecto",
                      "Provincia",
                      "Municipio",
                      "Estado de tramitación",
                      "Fecha de entrada",
                      "Fecha inicio de consultas",
                      "Fecha de resolución",
                  ):
                      m=re.search(re.escape(label)+r"\s*:?\s*(.{0,220})",body,re.I)
                      if m:
                          print(" DETAIL_FIELD",label,"=>",m.group(1)[:220])
          PY
