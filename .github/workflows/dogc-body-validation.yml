name: dogc-body-acquisition-validation
on:
  workflow_dispatch:
  push:
    branches: ['fix/dogc-index-reconciliation']
    paths:
      - 'scripts/acquire_dogc_bodies.py'
      - 'tests/test_dogc_bodies.py'
      - '.github/workflows/dogc-body-validation.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: dogc-body-acquisition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: All regression tests before acquisition
        run: python -m unittest discover -s tests
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37272974422
          name: dogc-daily-index-output
          path: certified-index
      - name: Rebuild certified index originals and acquire all candidate bodies
        run: python -u -m scripts.acquire_dogc_bodies --index-root certified-index --expected-index-run 37272974422
      - name: Actual acquisition outcome including failures
        if: always()
        run: |
          if [ -f reports/dogc_bodies/audit.json ]; then
            cat reports/dogc_bodies/audit.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dogc-document-bodies-output
          path: reports/dogc_bodies/
          if-no-files-found: error
