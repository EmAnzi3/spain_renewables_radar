name: dog-source-probe
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dog-source-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Inspect official dated navigation and preserve the responses
        run: |
          python -u - <<'PY'
          import hashlib,json,re
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          from urllib.parse import urljoin,urlsplit
          from zoneinfo import ZoneInfo
          import requests
          from bs4 import BeautifulSoup
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          session=requests.Session()
          session.headers['User-Agent']='SpainRenewablesRadar/0.5 (official DOG source probe)'
          session.mount('https://',HTTPAdapter(max_retries=Retry(total=1,backoff_factor=1,status_forcelist=(429,500,502,503,504))))
          root=Path('reports/dog_probe');root.mkdir(parents=True,exist_ok=True)
          base='https://www.xunta.gal/diario-oficial-galicia/'
          end=datetime.now(ZoneInfo('Europe/Madrid')).date()-timedelta(days=1)
          dates=[end-timedelta(days=i) for i in range(3)]
          targets=[('rss',base+'rss/Sumario_gl.rss')]+[(d.isoformat(),base+'portalPublicoHome.do?fecha='+d.strftime('%Y%m%d')+'&lang=es') for d in dates]
          audit={'source':'DOG','implemented':False,'collector_certified':False,'responses':[]}
          for label,url in targets:
              response=session.get(url,timeout=(8,40))
              if urlsplit(response.url).hostname!='www.xunta.gal':raise ValueError('Unexpected redirect host')
              raw=response.content;(root/(label+'.html')).write_bytes(raw)
              soup=BeautifulSoup(raw,'html.parser');text=' '.join(soup.stripped_strings)
              entry={'label':label,'url':response.url,'status':response.status_code,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'retrieved_at':datetime.now(timezone.utc).isoformat(),'links':[]}
              for a in soup.find_all('a',href=True):
                  link=urljoin(response.url,a['href']);name=a.get_text(' ',strip=True)
                  if any(k in link for k in ('/dog/Publicados/','portalPublicoHome','mostrarContenido','calendario','Indice','Sumario')):
                      entry['links'].append({'text':name[:250],'url':link})
              entry['frames']=[t.get('src') for t in soup.select('iframe[src],frame[src]')]
              entry['inputs']=[{k:t.get(k) for k in ('name','id','value','onclick')} for t in soup.select('input,button,form')][:50]
              entry['body_excerpt']=text[:4500]
              audit['responses'].append(entry)
              print('DOG_PROBE',json.dumps(entry,ensure_ascii=False),flush=True)
              (root/'probe.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
              response.raise_for_status()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dog-source-probe
          path: reports/dog_probe/
          if-no-files-found: error
