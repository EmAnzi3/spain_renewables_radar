name: dog-source-probe
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dog-source-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Follow published calendar protocol and verify dated editions
        run: |
          python -u - <<'PY'
          import hashlib,json,re
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          from urllib.parse import urljoin,urlsplit,parse_qsl
          from zoneinfo import ZoneInfo
          import requests
          from bs4 import BeautifulSoup
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          base='https://www.xunta.gal/diario-oficial-galicia/'
          root=Path('reports/dog_probe');root.mkdir(parents=True,exist_ok=True)
          audit={'source':'DOG','implemented':False,'collector_certified':False,'acquisitions':[],'months':[],'editions':[]}
          s=requests.Session();s.headers['User-Agent']='SpainRenewablesRadar/0.5 (official calendar validation)'
          s.mount('https://',HTTPAdapter(max_retries=Retry(total=2,backoff_factor=1,status_forcelist=(429,500,502,503,504),allowed_methods=frozenset({'GET','POST'}))))
          def request(url,label,data=None):
              if urlsplit(url).hostname!='www.xunta.gal':raise ValueError('Unexpected public host')
              r=s.post(url,data=data,timeout=(8,45)) if data is not None else s.get(url,timeout=(8,45))
              if urlsplit(r.url).hostname!='www.xunta.gal':raise ValueError('Unexpected redirect')
              raw=r.content;(root/(label+'.txt')).write_bytes(raw)
              audit['acquisitions'].append({'url':r.url,'method':'POST' if data is not None else 'GET','payload':data,'status':r.status_code,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'retrieved_at':datetime.now(timezone.utc).isoformat()})
              (root/'probe.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
              r.raise_for_status();return r
          home=request(base+'portalPublicoHome.do?lang=es','home')
          end=datetime.now(ZoneInfo('Europe/Madrid')).date()-timedelta(days=1)
          start=end-timedelta(days=29)
          months=sorted({(start.year,start.month),(end.year,end.month)})
          for year,month in months:
              r=request(base+'portalPublicoHome.do?method=getDiasDog',f'calendar-{year}-{month}',{'mes':month,'ano':year,'idioma':'es'})
              try:calendar=r.json()
              except ValueError:
                  print('CALENDAR_NON_JSON',r.status_code,r.text[:1000]);raise
              print('CALENDAR',year,month,json.dumps(calendar,ensure_ascii=False),flush=True)
              audit['months'].append({'year':year,'month':month,'calendar':calendar})
              if not isinstance(calendar,list) or not calendar:raise ValueError('Calendar is not a nonempty list')
              for index,item in enumerate(calendar[:2]+calendar[-2:]):
                  if not isinstance(item,dict) or not item.get('url'):raise ValueError('Missing official calendar URL')
                  url=urljoin(base,item['url']);response=request(url,f'edition-{year}-{month}-{index}')
                  soup=BeautifulSoup(response.content,'html.parser')
                  links=[]
                  for a in soup.select('a[href]'):
                      target=urljoin(response.url,a['href'])
                      if any(k in target for k in ('Secciones','Indice','Anuncio')):links.append({'label':a.get_text(' ',strip=True),'url':target})
                  record={'calendar':item,'url':response.url,'links':links,'text':' '.join(soup.stripped_strings)[:1800]}
                  audit['editions'].append(record)
                  print('EDITION',json.dumps(record,ensure_ascii=False),flush=True)
                  if not links:raise ValueError('No edition navigation in returned page')
                  if index==0:
                      sections=list(dict.fromkeys(x['url'].split('#')[0] for x in links if 'Secciones' in x['url']))
                      for n,section_url in enumerate(sections):
                          rr=request(section_url,f'section-{year}-{month}-{n}');ss=BeautifulSoup(rr.content,'html.parser')
                          rows=[{'url':urljoin(rr.url,a['href']),'text':a.get_text(' ',strip=True)} for a in ss.select('a[href]') if 'Anuncio' in a['href']]
                          print('SECTION',section_url,'announcements',len(rows),json.dumps(rows[:4],ensure_ascii=False),flush=True)
              (root/'probe.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dog-source-probe
          path: reports/dog_probe/
          if-no-files-found: error
