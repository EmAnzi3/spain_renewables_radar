name: claude-operational-diagnose
run-name: Dump selected DOGC original pages (read-only)
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set +e
          gh api repos/${{ github.repository }}/actions/artifacts/12006725881/zip > a.zip; mkdir a; (cd a && unzip -q ../a.zip)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git clone -q --depth 1 -b probe-results "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pr
          mkdir -p pr/dogc_pages && find a -name '1024529.pages.json' -exec cp {} pr/dogc_pages/ \;
          python3 - <<'PY'
          import json,glob
          for f in glob.glob('a/**/documents.json',recursive=True):
              for d in json.load(open(f)):
                  if d['candidate']['document_id']=='1024529':json.dump(d['candidate'],open('pr/dogc_pages/1024529.candidate.json','w'),ensure_ascii=False)
          PY
          cd pr && git add -A && git commit -qm "dogc pages 1024529" && git push -q origin probe-results
