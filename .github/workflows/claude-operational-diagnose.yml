name: claude-operational-diagnose
run-name: Operational refresh diagnosis (no publication)
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONUNBUFFERED: '1'
      SABIA_WORKERS: '4'
      SABIA_FORCE_LIVE_SAMPLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Restore state exactly as radar-operational-web
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python -m scripts.portal_inputs
      - name: Seed if needed
        run: if [ ! -f data/spain_renewables.sqlite ]; then python -m scripts.prepare_portal_seed --seed inputs/baseline; fi
      - name: Operational refresh (captured)
        run: |
          set +e
          python -u -m app.operational --db data/spain_renewables.sqlite --days 7 --cache-root inputs/baseline/data/sabia_cache > "$RUNNER_TEMP/op.log" 2>&1
          echo "exit=$?" >> "$RUNNER_TEMP/op.log"; tail -5 "$RUNNER_TEMP/op.log"
      - name: Publish diagnostics
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git clone -q --depth 1 -b probe-results "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$RUNNER_TEMP/pr"
          d="$RUNNER_TEMP/pr/operational/${GITHUB_RUN_ID}"; mkdir -p "$d"
          set +e
          tail -200 "$RUNNER_TEMP/op.log" > "$d/op_tail.log"
          find reports data -maxdepth 6 \( -name latest.json -o -name status.json \) -path '*operational*' -exec cp --backup=numbered {} "$d/" \;
          f=$(find reports data -name pipeline.log -path '*operational*' | head -1); [ -n "$f" ] && tail -300 "$f" > "$d/pipeline_tail.log"
          f=$(find reports data -name quality_issues_latest.csv -path '*runs*' | head -1); [ -n "$f" ] && grep -E "^(.?severity|ERROR)" "$f" > "$d/quality_errors.csv"
          f=$(find reports data -name coverage_latest.csv -path '*runs*' | head -1); [ -n "$f" ] && grep -v ",OK," "$f" > "$d/coverage_not_ok.csv"
          find reports data -path '*operational*' -maxdepth 5 | head -80 > "$d/tree.txt"
          cd "$RUNNER_TEMP/pr" && git add -A && git commit -qm "operational diag" && git push -q origin probe-results
