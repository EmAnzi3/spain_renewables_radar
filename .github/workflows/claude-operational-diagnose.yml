name: claude-operational-diagnose
run-name: Export published Pages site to probe-results (read-only)
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Copy the exact published Pages artifact into probe-results
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set +e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git clone -q --depth 1 -b probe-results "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pr
          d=pr/site/38820291492; mkdir -p $d
          { gh api repos/${{ github.repository }}/actions/artifacts/12014495285/zip > pages.zip; ls -la pages.zip
            mkdir pages; cd pages; unzip -o ../pages.zip; ls -la; for t in *.tar; do tar -xf "$t"; done; ls -la; cd ..
            cp pages/index.html pages/build_receipt.json $d/; } > $d/export.log 2>&1
          ls -la $d >> $d/export.log
          cd pr && git add -A && git commit -qm "published site 38820291492" && git push -q origin probe-results
