name: bopv-date-index-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bopv-date-index-probe.yml'
      - '.github/scripts/probe_bopv_dates.py'
permissions:
  contents: read
concurrency:
  group: bopv-date-index-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compile the probe before any source request
        run: python -m py_compile .github/scripts/probe_bopv_dates.py
      - name: Probe source-provided calendar and publication-date form
        run: python -u .github/scripts/probe_bopv_dates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bopv-date-index-probe-output
          path: reports/bopv_date_probe/
          if-no-files-found: error
