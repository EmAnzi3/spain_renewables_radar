name: dogc-dated-index-audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_dogc_index.py'
      - 'scripts/probe_dogc_services.py'
      - 'tests/test_dogc_index_audit.py'
      - '.github/workflows/dogc-index-validation.yml'
permissions:
  contents: read
concurrency:
  group: dogc-dated-index-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Unit and regression tests before source acquisition
        run: python -m unittest discover -s tests -v
      - name: Reconcile thirty-day calendars and editions with every search page
        run: python -u -m scripts.audit_dogc_index
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dogc-dated-index-output
          path: reports/dogc_index_audit/
          if-no-files-found: error
