name: gva-public-documents-probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gva-public-documents-probe.yml'
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37186210816
          name: gva-public-inventory-probe
          path: gva-source-input
      - name: Inspect distinct official legal acts; inventory other linked technical documents separately
        run: |
          python -u - <<'PY'
          import hashlib,json,re,time
          from pathlib import Path
          from urllib.parse import urljoin,urlparse,unquote
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          from bs4 import BeautifulSoup
          src=Path('gva-source-input');out=Path('reports/gva_documents_probe');out.mkdir(parents=True,exist_ok=True)
          records=json.loads((src/'window_records.json').read_text(encoding='utf-8'))
          s=requests.Session();s.headers['User-Agent']='SpainRenewablesRadar/0.3 official-document-audit'
          s.mount('https://',HTTPAdapter(max_retries=Retry(total=2,backoff_factor=0.8,status_forcelist=(429,500,502,503,504))))
          for record in records:
              record['pdf_documents']=[];record['technical_document_links']=[];seen=set()
              for directory in record['documents']:
                  raw=(src/directory['file']).read_bytes()
                  if not raw.startswith(b'<!') and b'<html' not in raw[:1000].lower():continue
                  soup=BeautifulSoup(raw,'html.parser')
                  for a in soup.select('a[href]'):
                      url=urljoin(directory['final_url'],a['href'])
                      if not (urlparse(url).hostname or '').endswith('.gva.es'):continue
                      if not urlparse(url).path.lower().endswith('.pdf') or url in seen:continue
                      seen.add(url)
                      label=a.get_text(' ',strip=True) or unquote(urlparse(url).path.rsplit('/',1)[-1])
                      if not re.search(r'resol|publica|anunci|desist|infopub',label,re.I):
                          record['technical_document_links'].append({'url':url,'label':label});continue
                      with s.get(url,timeout=(8,35),stream=True) as response:
                          response.raise_for_status()
                          chunks=[];size=0
                          for block in response.iter_content(65536):
                              size+=len(block)
                              if size>12_000_000:raise ValueError('Legal act exceeds probe size bound: '+url)
                              chunks.append(block)
                          content=b''.join(chunks)
                          if content[:5]!=b'%PDF-':raise ValueError('Official linked PDF returned non-PDF bytes')
                          name=record['external_id']+'-'+str(len(record['pdf_documents']))+'.pdf'
                          (out/name).write_bytes(content)
                          record['pdf_documents'].append({'url':url,'final_url':response.url,'label':label,'file':name,
                              'bytes':len(content),'sha256':hashlib.sha256(content).hexdigest()})
                          print('OFFICIAL_ACT',record['external_id'],label,len(content),flush=True)
                      time.sleep(0.1)
              (out/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          audit={'publications':len(records),'distinct_legal_act_pdfs':sum(len(r['pdf_documents']) for r in records),
                 'technical_pdf_links_not_downloaded':sum(len(r['technical_document_links']) for r in records),
                 'document_scope':'top-level explicitly linked legal acts only; technical subfolders not crawled',
                 'collector_implemented':False}
          (out/'audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PROBE_ONLY',json.dumps(audit),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gva-public-documents-probe
          path: reports/gva_documents_probe/
          if-no-files-found: error
