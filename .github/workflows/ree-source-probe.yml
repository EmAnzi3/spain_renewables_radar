name: ree-source-probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ree-source-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Probe REE public data
        run: |
          python - <<'PY'
          import re, urllib.parse, requests
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers["User-Agent"]="SpainRenewablesRadar/0.1"

          pages={
            "capacity":"https://www.ree.es/es/clientes/generador/acceso-conexion/conoce-la-capacidad-de-acceso",
            "requests":"https://www.ree.es/es/clientes/generador/acceso-conexion/conoce-el-estado-de-las-solicitudes",
          }

          for name,url in pages.items():
              print("\n=====",name.upper(),"=====")
              r=s.get(url,timeout=30)
              print("STATUS",r.status_code,r.headers.get("content-type"))
              r.raise_for_status()
              soup=BeautifulSoup(r.text,"html.parser")
              links=[]
              for a in soup.find_all("a",href=True):
                  href=urllib.parse.urljoin(url,a["href"])
                  label=" ".join(a.stripped_strings)
                  if any(k in (href+" "+label).lower() for k in (".csv",".xlsx",".json","generacion","solicitud","acceso")):
                      links.append((label,href))
              for label,href in links[:100]:
                  print("LINK",label[:140],"|",href)

              scripts=[urllib.parse.urljoin(url,x["src"]) for x in soup.find_all("script",src=True)]
              print("SCRIPTS",len(scripts))
              for script in scripts:
                  try:
                      js=s.get(script,timeout=30).text
                  except Exception:
                      continue
                  low=js.lower()
                  if any(k in low for k in ("solicitudes","comunidad autonoma","comunidad_autonoma","acceso-conexion","grt_generacion")):
                      print("SCRIPT_MATCH",script)
                      for key in ("solicitudes","comunidad_autonoma","grt_generacion",".json",".csv"):
                          pos=0
                          shown=0
                          while shown<5:
                              pos=low.find(key,pos)
                              if pos<0: break
                              print("SNIP",key,js[max(0,pos-500):min(len(js),pos+1200)].replace("\n"," ")[:1800])
                              pos+=len(key);shown+=1

          print("\n===== REQUESTS EMBEDS =====")
          r=s.get(pages["requests"],timeout=30)
          soup=BeautifulSoup(r.text,"html.parser")
          for iframe in soup.find_all("iframe"):
              print("IFRAME",dict(iframe.attrs))
          for tag in soup.find_all(True):
              attrs={k:v for k,v in tag.attrs.items() if any(z in k.lower() for z in ("data","src","url"))}
              blob=(str(attrs)+" "+tag.get_text(" ",strip=True)[:400]).lower()
              if any(k in blob for k in ("fotovolta","eólica","eolica","solicitud","comunidad autónoma","comunidad autonoma","powerbi","tableau")):
                  print("TAG",tag.name,attrs,tag.get_text(" ",strip=True)[:800])
          for script in soup.find_all("script"):
              if script.get("src"):
                  continue
              txt=script.get_text("\n")
              low=txt.lower()
              if any(k in low for k in ("fotovolta","eolica","solicitudes","powerbi","iframe","comunidad")):
                  print("INLINE_SCRIPT",txt[:20000])

          # Fetch first discovered GRT generation CSV from capacity page.
          r=s.get(pages["capacity"],timeout=30)
          soup=BeautifulSoup(r.text,"html.parser")
          csvs=[]
          for a in soup.find_all("a",href=True):
              href=urllib.parse.urljoin(pages["capacity"],a["href"])
              if "GRT_generacion" in href and href.lower().endswith(".csv"):
                  csvs.append(href)
          print("\n===== CSV CANDIDATES =====")
          print("\n".join(csvs))
          if csvs:
              rr=s.get(csvs[0],timeout=30)
              print("CSV_STATUS",rr.status_code,rr.headers.get("content-type"),"BYTES",len(rr.content))
              rr.raise_for_status()
              text=rr.content.decode("utf-8-sig","replace")
              print("CSV_HEAD")
              print("\n".join(text.splitlines()[:25]))
              import csv, io
              parsed=list(csv.reader(io.StringIO(text),delimiter=";"))
              print("CSV_ROWS",len(parsed),"COLS",max(len(x) for x in parsed))
              print("HEADER_INDEX")
              header_rows=parsed[:4]
              width=max(len(x) for x in header_rows)
              for i in range(width):
                  vals=[row[i].replace("\n"," ").strip() if i<len(row) else "" for row in header_rows]
                  if any(vals):
                      print(i," | ".join(vals))
              print("FIRST_DATA_ROWS")
              for row in parsed[4:9]:
                  print("ROW",[(i,v) for i,v in enumerate(row) if v.strip()][:45])
          PY
