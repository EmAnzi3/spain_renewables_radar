name: valencian-alternatives-probe
on:
  workflow_dispatch:
  push:
    branches: ['feat/operational-web-preview', 'main']
    paths:
      - '.github/scripts/probe_valencian_alternatives.py'
      - '.github/workflows/valencian-alternatives.yml'
permissions:
  contents: read
concurrency:
  group: valencian-alternatives-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -u .github/scripts/probe_valencian_alternatives.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valencian-alternatives-output
          path: reports/valencian_alternatives/
          if-no-files-found: error
